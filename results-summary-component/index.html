<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
  <title>Results summary component</title>

  <style>
    @font-face {
    font-family: 'Hanken Grotesk Mono Custom';
    src: url('./assets/fonts/HankenGrotesk-VariableFont_wght.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
}

:root{
    --light-red: hsl(0, 100%, 67%);
    --orangey-yellow: hsl(39, 100%, 56%);
    --green-teal: hsl(166, 100%, 37%);
    --cobalt-blue: hsl(234, 85%, 45%);

    --light-slate-blue: hsl(252, 100%, 67%);
    --light-royal-blue: hsl(241, 81%, 54%);
    --violet-blue: hsla(256, 72%, 46%, 1);
    --persian-blue: hsla(241, 72%, 46%, 0);

    --white: hsl(0, 0%, 100%);
    --pale-blue: hsl(221, 100%, 96%);
    --light-lavender: hsl(241, 100%, 89%);
    --dark-gray-blue: hsl(224, 30%, 27%);
}

*{
    margin: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Hanken Grotesk Mono Custom', sans-serif;
    min-height: 100vh;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--pale-blue); 
}

main {
    max-width: 375px;
    width: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); 
    overflow: hidden; 
    background-color: var(--white);
}

p{ font-size: 18px; }

.result {
    background: linear-gradient(var(--light-slate-blue), var(--light-royal-blue));
    padding: 40px;
    border-radius: 0 0 25px 25px;
}
.result-top{
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.result-top p{
    font-weight: 700;
}
.result-item{
    border-radius: 50%;
    background: linear-gradient(var(--violet-blue), var(--persian-blue));
    height: 8em;
    width: 8em;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.result-item .big-score {
    color: var(--white);
    font-size: 3.5rem;
    font-weight: 800;
    line-height: 1;
}

.result-item .total-score {
    color: var(--light-lavender);
    font-size: 1rem;
    font-weight: 500;
}

.result-top h2 {
    color: var(--white);
}
.result p{
    color: var(--light-lavender);
}

#results-summary {
    padding: 40px;
}
#results-summary h2{
    text-transform: capitalize;
    color: var(--dark-gray-blue);
}
#summary-items-list{
    display: flex;
    flex-direction: column;
    margin: 1em 0;  
    gap: 10px;
}
.summary-item{
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 5px;
    border-radius: 8px;
    height: 3.5em;
}
.result-category{
    display: flex;
    gap: 5px;
    align-items: center;
}
.reaction{
    background-color: hsla(0, 100%, 67%, 0.1);
    color: var(--light-red);
}
.memory{
    background-color: hsla(39, 100%, 56%, 0.1);
    color: var(--orangey-yellow);
}
.verbal{
    background-color: hsla(166, 100%, 37%, 0.1);
    color: var(--green-teal);
}
.visual{
    background-color: hsla(234, 85%, 45%, 0.1);
    color: var(--cobalt-blue);
}
.score span {
    color: var(--light-lavender);
}
.score span strong {
    color: var(--dark-gray-blue);
}
.continue-btn{
    border: none;
    text-transform: capitalize;
    color: var(--white);
    border-radius: 30px;
    width: 100%;
    height: 4em;
    background-color: var(--dark-gray-blue);
}
.continue-btn:hover {
    cursor: pointer;
    background: linear-gradient(var(--violet-blue), var(--light-royal-blue));
}

@media (min-width: 768px) {
    body {
        padding: 20px;
    }

    main {
        min-height: auto; 
        max-width: 768px;
        flex-direction: row;  
        border-radius: 30px; 
        box-shadow: 0 30px 60px rgba(61, 108, 236, 0.15);
    }

    .result, #results-summary {
        flex: 1; 
        display: flex;
        flex-direction: column;
    }

    .result {
        border-radius: 30px; 
        justify-content: space-between; 
        text-align: center;
        padding: 40px 80px;
    }

    .result-top h2{
        margin-top: 20px;
        margin-bottom: 20px;
    }
    
    .result-item {
        height: 12em;
        width: 12em;
        margin: 10px 0; 
    }

    .result-item .big-score {
        font-size: 4.5rem;
    }

    #results-summary {
        justify-content: space-between;
    }

    #summary-items-list {
        flex-grow: 1;
        justify-content: center;
    }
}
  </style>
</head>
<body>
  <main>
    <div class="result">
      <div class="result-top">
        <p>Your Result</p>
        <div class="result-item">
          <span class="big-score">76</span>
          <span class="total-score">of 100</span>
        </div>
        <h2>Great</h2>
      </div>

      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </div>

    <div id="results-summary">
      <h2>summary</h2>
      <div id="summary-items-list"></div>
      <button class="continue-btn">continue</button>
    </div>
  </main>
</body>
</html>
